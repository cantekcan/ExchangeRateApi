name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ExchangeRate.slnx

      - name: Build solution
        run: dotnet build ExchangeRate.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ExchangeRate.slnx --configuration Release --no-build

      - name: Docker Build
        run: docker build -t exchange-rate-api:ci .
